[xdebug]
xdebug.mode=debug
xdebug.start_with_request=yes
; Forwarderless: discover the client from the request's source IP, so Xdebug dials back to
; whichever device browsed the app (omarchy-local or any tailscale device) — no socat.
xdebug.discover_client_host=1
xdebug.client_host=host.docker.internal   ; fallback when discovery has no client to read
xdebug.client_port=9003
xdebug.log=/tmp/xdebug.log
xdebug.log_level=7
